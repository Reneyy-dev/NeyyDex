name: Bootstrap NeyyDex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build isolated NeyyDex branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Reneyy-dev"
          git config user.email "298354967+Reneyy-dev@users.noreply.github.com"
          git checkout -b feature/neyydex-v12

          curl -fsSL "https://raw.githubusercontent.com/infyiff/backup/50f904455e3d55efc133d4c547c8acfd6796d272/dex.lua" -o dex.lua
          curl -fsSL "https://raw.githubusercontent.com/LorekeeperZinnia/Dex/master/LICENSE" -o LICENSE

          python3 - <<'PY'
          from pathlib import Path
          source = Path("dex.lua").read_bytes()
          anchors = [
              b'ScriptViewer.ViewScript = function(scr)',
              b'env.getscriptbytecode = missing("function", getscriptbytecode)',
              b'env.request = missing("function", request or http_request or (syn and syn.request) or (http and http.request) or (fluxus and fluxus.request))',
              b'Text="Developed by Moon"',
          ]
          for anchor in anchors:
              assert source.count(anchor) == 1, (anchor, source.count(anchor))
          license_text = Path("LICENSE").read_text(encoding="utf-8")
          assert license_text.startswith("MIT License\n\nCopyright (c) 2021 LorekeeperZinnia")
          print("baseline verification: PASS")
          PY

          git add dex.lua LICENSE
          git commit -m "chore: import Dex baseline with upstream license"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("dex.lua")
          data = path.read_bytes()
          start_anchor = b'\t\tenv.getscriptbytecode = missing("function", getscriptbytecode)'
          end_anchor = b'\t\tend)())'
          assert data.count(start_anchor) == 1
          start = data.index(start_anchor)
          end = data.index(end_anchor, start) + len(end_anchor)
          nl = '\r\n' if b'\r\n' in data[start:end] else '\n'
          if data[end:end+2] == b'\r\n': end += 2
          elif data[end:end+1] == b'\n': end += 1

          lines = [
              '\t\tenv.getscriptbytecode = missing("function", getscriptbytecode)',
              '',
              '\t\t-- other',
              '\t\t--env.setfflag = missing("function", setfflag)',
              '\t\tenv.request = missing("function", request or http_request or (syn and syn.request) or (http and http.request) or (fluxus and fluxus.request))',
              '',
              '\t\tlocal nativeDecompile = missing("function", decompile)',
              '\t\tlocal legacyDecompile = nativeDecompile',
              '',
              '\t\tif not legacyDecompile and env.getscriptbytecode and env.request then',
              '\t\t\tlocal success = pcall(function()',
              '\t\t\t\tloadstring(oldgame:HttpGet("https://raw.githubusercontent.com/infyiff/backup/refs/heads/main/konstant.lua"))()',
              '\t\t\tend)',
              '\t\t\tlegacyDecompile = success and missing("function", decompile) or nil',
              '\t\tend',
              '',
              '\t\tlocal NEYY_DECOMPILE_ENDPOINT = "https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile"',
              '',
              '\t\tlocal function neyyRemoteDecompile(bytecode)',
              '\t\t\tlocal response = env.request({',
              '\t\t\t\tUrl = NEYY_DECOMPILE_ENDPOINT,',
              '\t\t\t\tMethod = "POST",',
              '\t\t\t\tHeaders = { ["Content-Type"] = "application/octet-stream" },',
              '\t\t\t\tBody = bytecode',
              '\t\t\t})',
              '\t\t\tlocal status = response and (response.StatusCode or response.Status or response.status_code)',
              '\t\t\tlocal body = response and (response.Body or response.body)',
              '\t\t\tif tonumber(status) ~= 200 then',
              '\t\t\t\terror(("Neyy decompiler HTTP %s"):format(tostring(status)))',
              '\t\t\tend',
              '\t\t\tif type(body) ~= "string" or body == "" then',
              '\t\t\t\terror("Neyy decompiler returned an empty response")',
              '\t\t\tend',
              '\t\t\treturn body',
              '\t\tend',
              '',
              '\t\tif env.getscriptbytecode and env.request then',
              '\t\t\tenv.decompile = function(scr)',
              '\t\t\t\tlocal bytecodeOk, bytecode = pcall(env.getscriptbytecode, scr)',
              '\t\t\t\tif bytecodeOk and type(bytecode) == "string" and #bytecode > 0 and string.byte(bytecode, 1) == 12 then',
              '\t\t\t\t\tlocal remoteOk, remoteSource = pcall(neyyRemoteDecompile, bytecode)',
              '\t\t\t\t\tif remoteOk then return remoteSource end',
              '\t\t\t\t\tif legacyDecompile then return legacyDecompile(scr) end',
              '\t\t\t\t\terror(remoteSource)',
              '\t\t\t\tend',
              '\t\t\t\tif legacyDecompile then return legacyDecompile(scr) end',
              '\t\t\t\treturn nil',
              '\t\t\tend',
              '\t\telse',
              '\t\t\tenv.decompile = legacyDecompile',
              '\t\tend',
          ]
          patched = data[:start] + (nl.join(lines) + nl).encode() + data[end:]
          assert patched.count(b'https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile') == 1
          assert b'application/octet-stream' in patched
          assert b'response.StatusCode or response.Status or response.status_code' in patched
          assert b'response.Body or response.body' in patched
          assert b'string.byte(bytecode, 1) == 12' in patched
          assert b'return legacyDecompile(scr)' in patched
          path.write_bytes(patched)
          print("v12 integration static verification: PASS")
          PY

          git add dex.lua
          git commit -m "feat: add v12 Cloudflare decompile fallback"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("dex.lua")
          data = path.read_bytes()
          old = b'Position=UDim2.new(1,-110,1,-20),Size=UDim2.new(0,105,0,20),Text="Developed by Moon",'
          new = b'Position=UDim2.new(1,-225,1,-20),Size=UDim2.new(0,220,0,20),Text="Created by Moon x Reneyy-dev",'
          assert data.count(old) == 1
          data = data.replace(old, new, 1)
          assert data.count(b'Text="Created by Moon x Reneyy-dev"') == 1
          path.write_bytes(data)
          print("Creator label static verification: PASS")
          PY

          git add dex.lua
          git commit -m "ui: credit Moon and Reneyy-dev in loader"

          python3 - <<'PY'
          from pathlib import Path
          dex = Path("dex.lua").read_bytes()
          license_text = Path("LICENSE").read_text(encoding="utf-8")
          assert dex.count(b'https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile') == 1
          assert b'CLOUDFLARE_API_TOKEN' not in dex
          assert dex.count(b'Text="Created by Moon x Reneyy-dev"') == 1
          assert 'Copyright (c) 2021 LorekeeperZinnia' in license_text
          print("final bootstrap verification: PASS")
          PY

          git push -u origin feature/neyydex-v12
