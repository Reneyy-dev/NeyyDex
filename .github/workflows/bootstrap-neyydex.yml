name: Bootstrap NeyyDex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build isolated NeyyDex branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Reneyy-dev"
          git config user.email "298354967+Reneyy-dev@users.noreply.github.com"
          git checkout -b feature/neyydex-v12

          # Task 1: exact upstream Dex baseline + verbatim upstream MIT license.
          curl -fsSL "https://raw.githubusercontent.com/infyiff/backup/50f904455e3d55efc133d4c547c8acfd6796d272/dex.lua" -o dex.lua
          curl -fsSL "https://raw.githubusercontent.com/LorekeeperZinnia/Dex/master/LICENSE" -o LICENSE

          python3 - <<'PY'
          from pathlib import Path
          source = Path("dex.lua").read_bytes()
          anchors = [
              b'ScriptViewer.ViewScript = function(scr)',
              b'env.getscriptbytecode = missing("function", getscriptbytecode)',
              b'env.request = missing("function", request or http_request or (syn and syn.request) or (http and http.request) or (fluxus and fluxus.request))',
              b'Text="Developed by Moon"',
          ]
          for anchor in anchors:
              count = source.count(anchor)
              if count != 1:
                  raise SystemExit(f"baseline anchor count for {anchor!r}: {count}, expected 1")

          license_text = Path("LICENSE").read_text(encoding="utf-8")
          if not license_text.startswith("MIT License\n\nCopyright (c) 2021 LorekeeperZinnia"):
              raise SystemExit("upstream MIT license notice did not match expected text")
          print("baseline verification: PASS")
          PY

          git add dex.lua LICENSE
          git commit -m "chore: import Dex baseline with upstream license"

          # Task 2: replace only Dex's decompiler initialization block.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dex.lua")
          data = path.read_bytes()
          start_anchor = b'\t\tenv.getscriptbytecode = missing("function", getscriptbytecode)'
          end_anchor = b'\t\tend)())'

          if data.count(start_anchor) != 1:
              raise SystemExit(f"getscriptbytecode anchor count was {data.count(start_anchor)}, expected 1")

          start = data.index(start_anchor)
          end = data.index(end_anchor, start) + len(end_anchor)
          if data[end:end+2] == b'\r\n':
              end += 2
              nl = '\r\n'
          elif data[end:end+1] == b'\n':
              end += 1
              nl = '\n'
          else:
              nl = '\r\n' if b'\r\n' in data[start:end] else '\n'

          lines = [
              '\t\tenv.getscriptbytecode = missing("function", getscriptbytecode)',
              '',
              '\t\t-- other',
              '\t\t--env.setfflag = missing("function", setfflag)',
              '\t\tenv.request = missing("function", request or http_request or (syn and syn.request) or (http and http.request) or (fluxus and fluxus.request))',
              '',
              '\t\tlocal nativeDecompile = missing("function", decompile)',
              '\t\tlocal legacyDecompile = nativeDecompile',
              '',
              '\t\tif not legacyDecompile and env.getscriptbytecode and env.request then',
              '\t\t\tlocal success = pcall(function()',
              '\t\t\t\tloadstring(oldgame:HttpGet("https://raw.githubusercontent.com/infyiff/backup/refs/heads/main/konstant.lua"))()',
              '\t\t\tend)',
              '\t\t\tlegacyDecompile = success and missing("function", decompile) or nil',
              '\t\tend',
              '',
              '\t\tlocal NEYY_DECOMPILE_ENDPOINT = "https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile"',
              '',
              '\t\tlocal function neyyRemoteDecompile(bytecode)',
              '\t\t\tlocal response = env.request({',
              '\t\t\t\tUrl = NEYY_DECOMPILE_ENDPOINT,',
              '\t\t\t\tMethod = "POST",',
              '\t\t\t\tHeaders = {',
              '\t\t\t\t\t["Content-Type"] = "application/octet-stream"',
              '\t\t\t\t},',
              '\t\t\t\tBody = bytecode',
              '\t\t\t})',
              '',
              '\t\t\tlocal status = response and (response.StatusCode or response.Status or response.status_code)',
              '\t\t\tlocal body = response and (response.Body or response.body)',
              '',
              '\t\t\tif tonumber(status) ~= 200 then',
              '\t\t\t\terror(("Neyy decompiler HTTP %s"):format(tostring(status)))',
              '\t\t\tend',
              '',
              '\t\t\tif type(body) ~= "string" or body == "" then',
              '\t\t\t\terror("Neyy decompiler returned an empty response")',
              '\t\t\tend',
              '',
              '\t\t\treturn body',
              '\t\tend',
              '',
              '\t\tif env.getscriptbytecode and env.request then',
              '\t\t\tenv.decompile = function(scr)',
              '\t\t\t\tlocal bytecodeOk, bytecode = pcall(env.getscriptbytecode, scr)',
              '',
              '\t\t\t\tif bytecodeOk and type(bytecode) == "string" and #bytecode > 0 and string.byte(bytecode, 1) == 12 then',
              '\t\t\t\t\tlocal remoteOk, remoteSource = pcall(neyyRemoteDecompile, bytecode)',
              '',
              '\t\t\t\t\tif remoteOk then',
              '\t\t\t\t\t\treturn remoteSource',
              '\t\t\t\t\tend',
              '',
              '\t\t\t\t\tif legacyDecompile then',
              '\t\t\t\t\t\treturn legacyDecompile(scr)',
              '\t\t\t\t\tend',
              '',
              '\t\t\t\t\terror(remoteSource)',
              '\t\t\t\tend',
              '',
              '\t\t\t\tif legacyDecompile then',
              '\t\t\t\t\treturn legacyDecompile(scr)',
              '\t\t\t\tend',
              '',
              '\t\t\t\treturn nil',
              '\t\t\tend',
              '\t\telse',
              '\t\t\tenv.decompile = legacyDecompile',
              '\t\tend',
          ]
          replacement = (nl.join(lines) + nl).encode("utf-8")
          patched = data[:start] + replacement + data[end:]

          endpoint = b'https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile'
          if patched.count(endpoint) != 1:
              raise SystemExit(f"endpoint count was {patched.count(endpoint)}, expected 1")
          if b'application/octet-stream' not in patched:
              raise SystemExit("raw bytecode content type missing")
          if b'response.StatusCode or response.Status or response.status_code' not in patched:
              raise SystemExit("StatusCode/Status response compatibility missing")
          if b'response.Body or response.body' not in patched:
              raise SystemExit("Body/body response compatibility missing")
          if b'string.byte(bytecode, 1) == 12' not in patched:
              raise SystemExit("v12 route guard missing")
          if b'return legacyDecompile(scr)' not in patched:
              raise SystemExit("legacy/native fallback missing")

          path.write_bytes(patched)
          print("v12 integration static verification: PASS")
          PY

          git add dex.lua
          git commit -m "feat: add v12 Cloudflare decompile fallback"

          # Task 3: change only the Creator label's bounds and text.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dex.lua")
          data = path.read_bytes()
          old = b'Position=UDim2.new(1,-110,1,-20),Size=UDim2.new(0,105,0,20),Text="Developed by Moon",'
          new = b'Position=UDim2.new(1,-225,1,-20),Size=UDim2.new(0,220,0,20),Text="Created by Moon x Reneyy-dev",'
          if data.count(old) != 1:
              raise SystemExit(f"Creator label anchor count was {data.count(old)}, expected 1")
          data = data.replace(old, new, 1)
          if data.count(b'Text="Created by Moon x Reneyy-dev"') != 1:
              raise SystemExit("new Creator text missing or duplicated")
          path.write_bytes(data)
          print("Creator label static verification: PASS")
          PY

          git add dex.lua
          git commit -m "ui: credit Moon and Reneyy-dev in loader"

          # Task 4: public usage and attribution docs.
          cat > README.md <<'EOF'
          # NeyyDex

          NeyyDex is a modified distribution of Dex with a maintained fallback for newer Roblox Luau bytecode.

          ## Credits

          - Dex originally created by Moon.
          - Based on the Dex lineage published by LorekeeperZinnia / Infinite Yield.
          - NeyyDex integration and maintenance by Reneyy-dev.
          - The Luau v12 fallback backend is maintained by Reneyy-dev and is based on the open-source `shiny` / `luau-lifter` work documented in the backend repository.

          NeyyDex does not claim the original Dex implementation as work authored solely by Reneyy-dev.

          ## Loader

          ```lua
          loadstring(game:HttpGet("https://raw.githubusercontent.com/Reneyy-dev/NeyyDex/main/dex.lua"))()
          ```

          ## Luau v12 fallback

          When `getscriptbytecode` reports bytecode version 12, NeyyDex sends the raw bytecode to:

          `https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile`

          The returned Luau source is displayed by the normal Dex Script Viewer. Non-v12 bytecode continues to use the executor/native or existing Dex fallback path.

          No Cloudflare deployment credential or API token is embedded in NeyyDex.

          ## Compatibility

          The v12 path has been tested successfully against multiple config modules, ModuleScripts, and PlayerScripts, including bytecode payloads above 10 KB. This is practical compatibility evidence, not a guarantee that every current or future Luau opcode, constant format, debug-info layout, or bytecode version will decompile successfully.

          ## License

          The original Dex distribution is MIT licensed. See `LICENSE` for the preserved upstream notice.
          EOF
          sed -i 's/^          //' README.md

          python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md").read_text(encoding="utf-8")
          lowered = readme.lower()
          for claim in ["100% universal", "all v12", "future-proof", "works on every game"]:
              if claim in lowered:
                  raise SystemExit(f"prohibited compatibility claim present: {claim}")
          if "ReneyyDex does not claim the original Dex implementation" not in readme:
              raise SystemExit("explicit upstream authorship disclaimer missing")
          print("README claim verification: PASS")
          PY

          git add README.md
          git commit -m "docs: document NeyyDex loader and v12 fallback"

          # Final static checks before publishing the feature branch.
          python3 - <<'PY'
          from pathlib import Path
          dex = Path("dex.lua").read_bytes()
          readme = Path("README.md").read_text(encoding="utf-8")
          license_text = Path("LICENSE").read_text(encoding="utf-8")

          assert dex.count(b'https://neyy-luau-decompiler.apa-kah1337.workers.dev/decompile') == 1
          assert b'CLOUDFLARE_API_TOKEN' not in dex
          assert 'CLOUDFLARE_API_TOKEN' not in readme
          assert 'Copyright (c) 2021 LorekeeperZinnia' in license_text
          assert dex.count(b'Text="Created by Moon x Reneyy-dev"') == 1
          assert b'Created by Moon' in dex
          assert 'Dex originally created by Moon.' in readme
          print("final static verification: PASS")
          PY

          # The bootstrap workflow is scaffolding only; final NeyyDex tree stays clean.
          git rm .github/workflows/bootstrap-neyydex.yml
          git commit -m "chore: remove bootstrap workflow"

          git push origin feature/neyydex-v12
